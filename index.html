<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cờ Vua Neo - Wood Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #262421;
      color: #e5e5e5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Bàn cờ vân gỗ tự nhiên giống hệt ảnh mẫu */
    .chess-board-wrapper {
      position: relative;
      width: min(94vw, 560px);
      aspect-ratio: 1 / 1;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
      background: #7a5230;
      touch-action: none;
    }

    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .square {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* =========================================================================
       4 CHỦ ĐỀ BÀN CỜ (BOARD THEMES)
       ========================================================================= */
    /* 1. Gỗ Neo (Mặc định giống hệt ảnh mẫu) */
    .theme-wood .square.light {
      background-color: #d6b485;
      background-image:
        repeating-linear-gradient(90deg, rgba(165, 118, 62, 0.06) 0px, rgba(165, 118, 62, 0.06) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(88deg, rgba(255, 244, 224, 0.14) 0px, rgba(255, 244, 224, 0.14) 2px, rgba(150, 102, 48, 0.08) 2px, rgba(150, 102, 48, 0.08) 7px),
        radial-gradient(ellipse at 30% 40%, rgba(255, 242, 218, 0.25), rgba(178, 132, 74, 0.22));
    }
    .theme-wood .square.dark {
      background-color: #845934;
      background-image:
        repeating-linear-gradient(90deg, rgba(48, 26, 10, 0.12) 0px, rgba(48, 26, 10, 0.12) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(91deg, rgba(182, 130, 82, 0.09) 0px, rgba(182, 130, 82, 0.09) 3px, rgba(52, 28, 11, 0.13) 3px, rgba(52, 28, 11, 0.13) 8px),
        radial-gradient(ellipse at 65% 55%, rgba(162, 112, 66, 0.18), rgba(62, 36, 16, 0.25));
    }
    .theme-wood .square.light .coord-rank,
    .theme-wood .square.light .coord-file { color: #7c532f; }
    .theme-wood .square.dark .coord-rank,
    .theme-wood .square.dark .coord-file { color: #dec096; }

    /* 2. Xanh Ngọc Lục Bảo (Tournament Green) */
    .theme-green .square.light { background-color: #eeeed2; }
    .theme-green .square.dark { background-color: #769656; }
    .theme-green .square.light .coord-rank,
    .theme-green .square.light .coord-file { color: #769656; }
    .theme-green .square.dark .coord-rank,
    .theme-green .square.dark .coord-file { color: #eeeed2; }

    /* 3. Đá Cẩm Thạch Xanh (Ocean Marble) */
    .theme-marble .square.light {
      background-color: #dee3e6;
      background-image: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.55), rgba(198, 208, 214, 0.35));
    }
    .theme-marble .square.dark {
      background-color: #8ca2ad;
      background-image: radial-gradient(circle at 70% 60%, rgba(165, 186, 196, 0.35), rgba(108, 132, 144, 0.4));
    }
    .theme-marble .square.light .coord-rank,
    .theme-marble .square.light .coord-file { color: #677f8b; }
    .theme-marble .square.dark .coord-rank,
    .theme-marble .square.dark .coord-file { color: #e8eef1; }

    /* 4. Gỗ Đỏ Hoàng Gia (Mahogany) */
    .theme-mahogany .square.light {
      background-color: #f0d9b5;
      background-image: repeating-linear-gradient(90deg, rgba(181, 136, 99, 0.05) 0px, rgba(181, 136, 99, 0.05) 2px, transparent 2px, transparent 6px);
    }
    .theme-mahogany .square.dark {
      background-color: #b58863;
      background-image: repeating-linear-gradient(90deg, rgba(95, 58, 32, 0.09) 0px, rgba(95, 58, 32, 0.09) 2px, transparent 2px, transparent 5px);
    }
    .theme-mahogany .square.light .coord-rank,
    .theme-mahogany .square.light .coord-file { color: #9c6f4a; }
    .theme-mahogany .square.dark .coord-rank,
    .theme-mahogany .square.dark .coord-file { color: #f5e4c8; }

    /* Các lớp tô màu trạng thái ô cờ */
    .square-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transition: background-color 0.12s ease;
    }

    /* Nước đi vừa thực hiện */
    .square.last-move .square-overlay {
      background-color: rgba(245, 198, 48, 0.50);
    }

    /* Ô đang được chọn */
    .square.selected .square-overlay {
      background-color: rgba(245, 205, 55, 0.62);
    }

    /* Ô đang rê quân cờ qua khi kéo (Drag hover) */
    .square.drag-over::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.45);
      z-index: 5;
      pointer-events: none;
    }

    /* Ô Vua bị chiếu / chiếu hết: đỏ san hô cảnh báo */
    .square.in-check .square-overlay {
      background: radial-gradient(circle, rgba(242, 72, 62, 0.94) 0%, rgba(226, 58, 48, 0.85) 72%, rgba(210, 45, 38, 0.82) 100%);
      animation: checkPulse 1.3s ease-in-out infinite;
    }

    @keyframes checkPulse {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; }
    }

    /* Gợi ý nước đi hợp lệ */
    .move-hint-dot {
      position: absolute;
      width: 31%;
      height: 31%;
      border-radius: 50%;
      background-color: rgba(26, 24, 21, 0.25);
      z-index: 3;
      pointer-events: none;
    }

    .move-hint-capture {
      position: absolute;
      width: 86%;
      height: 86%;
      border-radius: 50%;
      border: 5px solid rgba(26, 24, 21, 0.28);
      z-index: 3;
      pointer-events: none;
    }

    /* Tọa độ bàn cờ */
    .coord-rank {
      position: absolute;
      top: 4%;
      left: 6%;
      font-size: clamp(10px, 2.2vw, 13px);
      font-weight: 700;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
    }

    .coord-file {
      position: absolute;
      bottom: 4%;
      right: 6%;
      font-size: clamp(10px, 2.2vw, 13px);
      font-weight: 700;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
    }

    /* Quân cờ SVG */
    .piece-container {
      position: relative;
      width: 86%;
      height: 86%;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.12s ease;
      filter: drop-shadow(0 2.5px 1.8px rgba(0, 0, 0, 0.32));
      cursor: grab;
    }

    .piece-container.dragging-source {
      opacity: 0.25;
    }

    .piece-container svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Quân cờ nổi bám sát con trỏ khi kéo thả 60fps */
    #drag-ghost {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      transform: translate3d(-50%, -50%, 0) scale(1.16);
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.52));
      will-change: transform, left, top;
    }

    #drag-ghost svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* =========================================================================
       HIỆU ỨNG VUA GIẬT NHẸ KHI BỊ CHIẾU THƯỜNG (CHECK SHAKE)
       ========================================================================= */
    .piece-container.checked-king-shake {
      animation: kingCheckJerk 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1;
    }

    @keyframes kingCheckJerk {
      0%   { transform: translateX(0) rotate(0deg); }
      16%  { transform: translateX(-8%) rotate(-4.5deg); }
      34%  { transform: translateX(8%) rotate(4.5deg); }
      52%  { transform: translateX(-5.5%) rotate(-3deg); }
      70%  { transform: translateX(4.5%) rotate(2.5deg); }
      86%  { transform: translateX(-2%) rotate(-1deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    /* Hiệu ứng Vua bị chiếu hết nằm ngang 90 độ giống ảnh 1 */
    .piece-container.checkmated-king {
      animation: kingTopple 0.65s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
      transform-origin: 52% 62%;
    }

    @keyframes kingTopple {
      0% {
        transform: rotate(0deg) translateY(0);
      }
      55% {
        transform: rotate(96deg) translate(4%, -4%);
      }
      80% {
        transform: rotate(87deg) translate(3%, -3%);
      }
      100% {
        transform: rotate(90deg) translate(3%, -3%);
      }
    }

    /* Huy hiệu kết thúc ván (Vua đổ đỏ & Vương miện xanh lá giống ảnh 1) */
    .endgame-badge {
      position: absolute;
      top: -10%;
      right: -10%;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      animation: badgePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s backwards;
      pointer-events: none;
    }

    .badge-loser {
      background-color: #e53935;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .badge-winner {
      background-color: #7cb342;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    @keyframes badgePop {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Nút bấm giao diện hiện đại */
    .btn-control {
      background: #33302d;
      border: 1px solid #45413d;
      color: #e8e6e3;
      transition: all 0.15s ease;
    }
    .btn-control:hover:not(:disabled) {
      background: #403c38;
      border-color: #5c5752;
      transform: translateY(-1px);
    }
    .btn-control:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-control:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .level-pill.active {
      background: #81b64c;
      color: #ffffff;
      border-color: #95cc5c;
      box-shadow: 0 2px 8px rgba(129, 182, 76, 0.35);
    }

    .theme-option-btn.active,
    .piece-option-btn.active {
      border-color: #81b64c;
      background-color: #36332f;
      box-shadow: 0 0 0 1px #81b64c;
    }

    /* Thanh cuộn gọn cho lịch sử nước đi */
    .pgn-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .pgn-scroll::-webkit-scrollbar-track {
      background: #1c1a18;
    }
    .pgn-scroll::-webkit-scrollbar-thumb {
      background: #46423d;
      border-radius: 4px;
    }

    /* Popup phong cấp Tốt */
    .promo-modal {
      background: rgba(24, 22, 20, 0.78);
      backdrop-filter: blur(4px);
    }

    .promo-choice {
      background: #d6b485;
      border: 2px solid #4a3520;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .promo-choice:hover {
      background: #ebd0a8;
      transform: scale(1.07);
    }
  </style>
</head>
<body class="py-3 px-2 sm:py-5">

  <!-- Quân cờ nổi bám sát con trỏ khi kéo thả -->
  <div id="drag-ghost"></div>

  <!-- Thanh tiêu đề, chọn mức độ & nút Cài đặt giao diện -->
  <div class="w-full max-w-[560px] flex flex-col gap-2 mb-2">
    <div class="flex flex-wrap items-center justify-between gap-2 bg-[#1e1c1a] px-3 py-2 rounded-xl border border-[#33302c] shadow-md">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-[#81b64c] shadow-[0_0_8px_#81b64c]"></div>
        <span class="font-bold text-sm sm:text-base tracking-tight text-white">Cờ Vua</span>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Chọn 3 mức độ AI -->
        <div class="flex items-center bg-[#2a2724] p-1 rounded-lg border border-[#3b3733]" role="group" aria-label="Mức độ khó">
          <button id="lvl-1" onclick="setDifficulty(1)" class="level-pill px-2 sm:px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-stone-300">
            Dễ
          </button>
          <button id="lvl-2" onclick="setDifficulty(2)" class="level-pill active px-2 sm:px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-stone-300">
            Trung bình
          </button>
          <button id="lvl-3" onclick="setDifficulty(3)" class="level-pill px-2 sm:px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-stone-300">
            Khó
          </button>
        </div>

        <!-- Nút mở/đóng bảng Tùy chỉnh Bàn cờ & Quân cờ -->
        <button id="btn-customize-toggle" onclick="toggleCustomizePanel()" class="btn-control p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5" title="Tùy chỉnh bàn cờ & quân cờ">
          <svg class="w-4 h-4 text-[#95cc5c]" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
          <span class="hidden sm:inline">Giao diện</span>
        </button>
      </div>
    </div>

    <!-- Bảng Tùy chọn Giao diện Bàn cờ & Bộ Quân cờ (Mở/đóng nhanh không gián đoạn ván đấu) -->
    <div id="customize-panel" class="hidden bg-[#1e1c1a] p-3 rounded-xl border border-[#3a3631] shadow-xl flex flex-col gap-3">
      <div>
        <div class="text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1.5">Chủ đề bàn cờ</div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <button id="theme-btn-wood" onclick="setBoardTheme('wood')" class="theme-option-btn active flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] text-left transition">
            <span class="w-5 h-5 rounded shrink-0 border border-black/30 overflow-hidden grid grid-cols-2 grid-rows-2">
              <span class="bg-[#d6b485]"></span><span class="bg-[#845934]"></span>
              <span class="bg-[#845934]"></span><span class="bg-[#d6b485]"></span>
            </span>
            <span class="text-xs font-semibold text-stone-200 truncate">Gỗ Neo</span>
          </button>

          <button id="theme-btn-green" onclick="setBoardTheme('green')" class="theme-option-btn flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] text-left transition">
            <span class="w-5 h-5 rounded shrink-0 border border-black/30 overflow-hidden grid grid-cols-2 grid-rows-2">
              <span class="bg-[#eeeed2]"></span><span class="bg-[#769656]"></span>
              <span class="bg-[#769656]"></span><span class="bg-[#eeeed2]"></span>
            </span>
            <span class="text-xs font-semibold text-stone-200 truncate">Ngọc Lục Bảo</span>
          </button>

          <button id="theme-btn-marble" onclick="setBoardTheme('marble')" class="theme-option-btn flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] text-left transition">
            <span class="w-5 h-5 rounded shrink-0 border border-black/30 overflow-hidden grid grid-cols-2 grid-rows-2">
              <span class="bg-[#dee3e6]"></span><span class="bg-[#8ca2ad]"></span>
              <span class="bg-[#8ca2ad]"></span><span class="bg-[#dee3e6]"></span>
            </span>
            <span class="text-xs font-semibold text-stone-200 truncate">Cẩm Thạch</span>
          </button>

          <button id="theme-btn-mahogany" onclick="setBoardTheme('mahogany')" class="theme-option-btn flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] text-left transition">
            <span class="w-5 h-5 rounded shrink-0 border border-black/30 overflow-hidden grid grid-cols-2 grid-rows-2">
              <span class="bg-[#f0d9b5]"></span><span class="bg-[#b58863]"></span>
              <span class="bg-[#b58863]"></span><span class="bg-[#f0d9b5]"></span>
            </span>
            <span class="text-xs font-semibold text-stone-200 truncate">Gỗ Hoàng Gia</span>
          </button>
        </div>
      </div>

      <div>
        <div class="text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1.5">Phong cách quân cờ</div>
        <div class="grid grid-cols-3 gap-2">
          <button id="piece-btn-neo" onclick="setPieceStyle('neo')" class="piece-option-btn active flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] transition">
            <div id="preview-piece-neo" class="w-6 h-6 shrink-0"></div>
            <span class="text-xs font-semibold text-stone-200 truncate">Neo</span>
          </button>

          <button id="piece-btn-classic" onclick="setPieceStyle('classic')" class="piece-option-btn flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] transition">
            <div id="preview-piece-classic" class="w-6 h-6 shrink-0"></div>
            <span class="text-xs font-semibold text-stone-200 truncate">Cổ Điển</span>
          </button>

          <button id="piece-btn-minimal" onclick="setPieceStyle('minimal')" class="piece-option-btn flex items-center gap-2 p-2 rounded-lg bg-[#292623] border border-[#3d3934] transition">
            <div id="preview-piece-minimal" class="w-6 h-6 shrink-0"></div>
            <span class="text-xs font-semibold text-stone-200 truncate">Tối Giản</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Thanh thông tin đối thủ (Phía trên bàn cờ) -->
    <div class="flex items-center justify-between px-2 py-0.5">
      <div class="flex items-center gap-2.5">
        <div id="top-avatar" class="w-8 h-8 rounded-lg bg-[#3c3936] border border-[#524e4a] flex items-center justify-center font-bold text-xs text-stone-200 shadow-inner">
          AI
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span id="top-name" class="text-sm font-bold text-stone-100">Máy (Trung bình)</span>
            <span id="ai-thinking" class="hidden text-xs font-medium text-[#95cc5c] animate-pulse">đang suy nghĩ...</span>
          </div>
          <div id="top-captured" class="flex items-center gap-0.5 h-4 mt-0.5"></div>
        </div>
      </div>
      <div id="status-banner" class="text-xs sm:text-sm font-semibold px-3 py-1 rounded-lg bg-[#312e2b] text-amber-200 border border-[#45413c]">
        Lượt quân Trắng
      </div>
    </div>
  </div>

  <!-- Bàn cờ trung tâm -->
  <div class="chess-board-wrapper theme-wood" id="board-wrapper">
    <div class="chess-board" id="chess-board"></div>

    <!-- Modal Phong cấp Tốt -->
    <div id="promotion-modal" class="promo-modal hidden absolute inset-0 z-30 flex items-center justify-center p-4">
      <div class="bg-[#262421] border border-[#4a453f] rounded-2xl p-4 shadow-2xl text-center max-w-xs w-full">
        <p class="text-sm font-bold text-stone-100 mb-3">Chọn quân phong cấp</p>
        <div id="promotion-options" class="grid grid-cols-4 gap-2.5"></div>
      </div>
    </div>

    <!-- Banner thông báo kết thúc ván nổi gọn ở đáy bàn cờ -->
    <div id="game-over-toast" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 z-20 bg-[#22201d]/95 border border-[#524c44] px-4 py-2 rounded-xl shadow-2xl flex items-center gap-3 whitespace-nowrap">
      <span id="game-over-text" class="text-xs sm:text-sm font-bold text-white">Chiếu hết!</span>
      <button onclick="startNewGame()" class="px-2.5 py-1 rounded-lg bg-[#81b64c] hover:bg-[#92c75a] text-white text-xs font-bold transition">
        Chơi lại
      </button>
    </div>
  </div>

  <!-- Thanh thông tin người chơi (Phía dưới bàn cờ) & Bảng điều khiển -->
  <div class="w-full max-w-[560px] flex flex-col gap-2.5 mt-2">
    <div class="flex items-center justify-between px-2 py-0.5">
      <div class="flex items-center gap-2.5">
        <div id="bottom-avatar" class="w-8 h-8 rounded-lg bg-[#e8e6e3] border border-[#b5b0a8] flex items-center justify-center font-bold text-xs text-[#262421]">
          BẠN
        </div>
        <div>

    /**
     * =========================================================================
     * 2. ÂM THANH CỜ VUA TỔNG HỢP QUA WEB AUDIO API (KHÔNG CẦN FILE NGOÀI)
     * =========================================================================
     */
    const SoundFX = (() => {
      let ctx = null;
      let enabled = true;

      function ensureContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
      }

      function playMove(isCapture = false, isCheck = false, isCastle = false) {
        if (!enabled) return;
        try {
          ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          // Tiếng gõ quân gỗ trầm ấm
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = isCapture ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(isCapture ? 210 : 165, now);
          osc.frequency.exponentialRampToValueAtTime(58, now + 0.085);

          gain.gain.setValueAtTime(isCapture ? 0.35 : 0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.095);

          // Nếu ăn quân hoặc nhập thành thêm nhịp gõ thứ 2
          if (isCapture || isCastle) {
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(290, now + 0.045);
            osc2.frequency.exponentialRampToValueAtTime(90, now + 0.12);
            gain2.gain.setValueAtTime(0.22, now + 0.045);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.125);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.045);
            osc2.stop(now + 0.13);
          }

          // Nếu chiếu tướng thêm âm báo sắc nét
          if (isCheck) {
            const oscC = ctx.createOscillator();
            const gainC = ctx.createGain();
            oscC.type = 'triangle';
            oscC.frequency.setValueAtTime(540, now + 0.06);
            oscC.frequency.exponentialRampToValueAtTime(420, now + 0.24);
            gainC.gain.setValueAtTime(0.2, now + 0.06);
            gainC.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            oscC.connect(gainC);
            gainC.connect(ctx.destination);
            oscC.start(now + 0.06);
            oscC.stop(now + 0.26);
          }
        } catch (e) {}
      }

      function playGameOver(playerWon) {
        if (!enabled) return;
        try {
          ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = playerWon ? [392, 493.88, 587.33, 783.99] : [392, 349.23, 311.13, 261.63];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
            gain.gain.setValueAtTime(0.18, now + idx * 0.11);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 0.34);
          });
        } catch (e) {}
      }

      return {
        playMove,
        playGameOver,
        toggle() {
          enabled = !enabled;
          return enabled;
        },
        isEnabled: () => enabled
      };
    })();

    /**
     * =========================================================================
     * 3. ENGINE LUẬT CỜ VUA QUỐC TẾ ĐẦY ĐỦ (NHẬP THÀNH, EN PASSANT, PHONG CẤP,
     *    CHIẾU, CHIẾU HẾT, STALEMATE, THIẾU LỰC LƯỢNG, LẶP LẠI 3 LẦN)
     * =========================================================================
     */
    const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    // Trạng thái bàn cờ: mảng 8x8, mỗi ô là null hoặc { type: 'p'|'r'|'n'|'b'|'q'|'k', color: 'w'|'b' }
    let board = [];
    let turn = 'w';
    let castling = { wK: true, wQ: true, bK: true, bQ: true };
    let enPassantTarget = null; // { r, c } hoặc null
    let halfMoveClock = 0;
    let positionHistory = {};
    let moveStack = []; // Lưu lịch sử để Đi lại (Undo)
    let algebraicHistory = []; // Lịch sử nước đi chuẩn đại số (e4, Nf3, O-O...)

    // Trạng thái giao diện
    let playerColor = 'w';
    let flipped = false;
    let difficulty = 2; // 1: Dễ, 2: Trung bình, 3: Khó
    let selectedSq = null;
    let legalMovesForSelected = [];
    let lastMove = null; // { from: {r,c}, to: {r,c} }
    let gameResult = null; // null | { status: 'checkmate'|'stalemate'|'draw', winner: 'w'|'b'|null, reason: string }
    let pendingPromotion = null; // { from, to }
    let isAiThinking = false;
    let aiTimer = null;
    let triggerCheckShake = false; // Kích hoạt rung nhẹ Vua khi vừa bị chiếu

    // Trạng thái hệ thống Kéo Thả mượt mà (Pointer Events)
    let dragState = {
      active: false,
      pointerId: null,
      from: null,
      startX: 0,
      startY: 0,
      hasMoved: false,
      hoverSq: null
    };

    function createInitialBoard() {
      const backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
      const b = Array.from({ length: 8 }, () => Array(8).fill(null));
      for (let c = 0; c < 8; c++) {
        b[0][c] = { type: backRank[c], color: 'b' };
        b[1][c] = { type: 'p', color: 'b' };
        b[6][c] = { type: 'p', color: 'w' };
        b[7][c] = { type: backRank[c], color: 'w' };
      }
      return b;
    }

    function cloneBoard(b) {
      return b.map(row => row.map(cell => (cell ? { ...cell } : null)));
    }

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function getPositionKey(b, currentTurn, castlingRights, ep) {
      let rows = '';
      for (let r = 0; r < 8; r++) {
        let empty = 0;
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p) {
            empty++;
          } else {
            if (empty > 0) { rows += empty; empty = 0; }
            rows += p.color === 'w' ? p.type.toUpperCase() : p.type;
          }
        }
        if (empty > 0) rows += empty;
        if (r < 7) rows += '/';
      }
      const cStr = (castlingRights.wK ? 'K' : '') + (castlingRights.wQ ? 'Q' : '') +
                   (castlingRights.bK ? 'k' : '') + (castlingRights.bQ ? 'q' : '') || '-';
      const epStr = ep ? `${ep.r},${ep.c}` : '-';
      return `${rows} ${currentTurn} ${cStr} ${epStr}`;
    }

    function findKing(b, color) {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (p && p.type === 'k' && p.color === color) {
            return { r, c };
          }
        }
      }
      return null;
    }

    // Kiểm tra ô (r, c) có bị tấn công bởi phe `attackerColor` không
    function isSquareAttacked(b, r, c, attackerColor) {
      // 1. Tốt tấn công
      const pawnDir = attackerColor === 'w' ? 1 : -1; // Tốt trắng ở hàng lớn hơn tấn công lên hàng nhỏ hơn
      for (const dc of [-1, 1]) {
        const pr = r + pawnDir;
        const pc = c + dc;
        if (inBounds(pr, pc)) {
          const p = b[pr][pc];
          if (p && p.color === attackerColor && p.type === 'p') return true;
        }
      }

      // 2. Mã tấn công
      const knightD = [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]];
      for (const [dr, dc] of knightD) {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc)) {
          const p = b[nr][nc];
          if (p && p.color === attackerColor && p.type === 'n') return true;
        }
      }

      // 3. Vua tấn công
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const kr = r + dr, kc = c + dc;
          if (inBounds(kr, kc)) {
            const p = b[kr][kc];
            if (p && p.color === attackerColor && p.type === 'k') return true;
          }
        }
      }

      // 4. Xe / Hậu (hàng ngang & cột dọc)
      const orthoD = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (const [dr, dc] of orthoD) {
        let nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc)) {
          const p = b[nr][nc];
          if (p) {
            if (p.color === attackerColor && (p.type === 'r' || p.type === 'q')) return true;
            break;
          }
          nr += dr;
          nc += dc;
        }
      }

      // 5. Tượng / Hậu (đường chéo)
      const diagD = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
      for (const [dr, dc] of diagD) {
        let nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc)) {
          const p = b[nr][nc];
          if (p) {
            if (p.color === attackerColor && (p.type === 'b' || p.type === 'q')) return true;
            break;
          }
          nr += dr;
          nc += dc;
        }
      }

      return false;
    }

    function isKingInCheck(b, color) {
      const kPos = findKing(b, color);
      if (!kPos) return false;
      const enemy = color === 'w' ? 'b' : 'w';
      return isSquareAttacked(b, kPos.r, kPos.c, enemy);
    }

    // Sinh toàn bộ nước đi giả hợp lệ (pseudo-legal) cho một phe
    function generatePseudoMoves(b, color, castlingRights, ep) {
      const moves = [];
      const enemy = color === 'w' ? 'b' : 'w';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p || p.color !== color) continue;

          if (p.type === 'p') {
            const dir = color === 'w' ? -1 : 1;
            const startRow = color === 'w' ? 6 : 1;
            const promoRow = color === 'w' ? 0 : 7;

            // Tiến 1 ô
            const r1 = r + dir;
            if (inBounds(r1, c) && !b[r1][c]) {
              if (r1 === promoRow) {
                for (const promo of ['q', 'r', 'b', 'n']) {
                  moves.push({ from: { r, c }, to: { r: r1, c }, promotion: promo });
                }
              } else {
                moves.push({ from: { r, c }, to: { r: r1, c } });
                // Tiến 2 ô từ vị trí ban đầu
                const r2 = r + dir * 2;
                if (r === startRow && !b[r2][c]) {
                  moves.push({ from: { r, c }, to: { r: r2, c }, doublePawn: true });
                }
              }
            }

            // Ăn chéo & Bắt tốt qua đường (En Passant)
            for (const dc of [-1, 1]) {
              const nc = c + dc;
              if (!inBounds(r1, nc)) continue;
              const target = b[r1][nc];
              if (target && target.color === enemy) {
                if (r1 === promoRow) {
                  for (const promo of ['q', 'r', 'b', 'n']) {
                    moves.push({ from: { r, c }, to: { r: r1, c: nc }, capture: true, promotion: promo });
                  }
                } else {
                  moves.push({ from: { r, c }, to: { r: r1, c: nc }, capture: true });
                }
              } else if (ep && ep.r === r1 && ep.c === nc) {
                moves.push({ from: { r, c }, to: { r: r1, c: nc }, capture: true, enPassant: true });
              }
            }
          } else if (p.type === 'n') {
            const jumps = [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]];
            for (const [dr, dc] of jumps) {
              const nr = r + dr, nc = c + dc;
              if (!inBounds(nr, nc)) continue;
              const target = b[nr][nc];
              if (!target || target.color === enemy) {
                moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: !!target });
              }
            }
          } else if (p.type === 'b' || p.type === 'r' || p.type === 'q') {
            const dirs = [];
            if (p.type === 'r' || p.type === 'q') dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);
            if (p.type === 'b' || p.type === 'q') dirs.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
            for (const [dr, dc] of dirs) {
              let nr = r + dr, nc = c + dc;
              while (inBounds(nr, nc)) {
                const target = b[nr][nc];
                if (!target) {
                  moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                } else {
                  if (target.color === enemy) {
                    moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: true });
                  }
                  break;
                }
                nr += dr;
                nc += dc;
              }
            }
          } else if (p.type === 'k') {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr, nc = c + dc;
                if (!inBounds(nr, nc)) continue;
                const target = b[nr][nc];
                if (!target || target.color === enemy) {
                  moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: !!target });
                }
              }
            }

            // Nhập thành (Castling)
            const homeRow = color === 'w' ? 7 : 0;
            if (r === homeRow && c === 4 && !isSquareAttacked(b, homeRow, 4, enemy)) {
              // Nhập thành gần (King-side)
              const canKingSide = color === 'w' ? castlingRights.wK : castlingRights.bK;
              if (canKingSide && !b[homeRow][5] && !b[homeRow][6]) {
                const rook = b[homeRow][7];
                if (rook && rook.type === 'r' && rook.color === color &&
                    !isSquareAttacked(b, homeRow, 5, enemy) &&
                    !isSquareAttacked(b, homeRow, 6, enemy)) {
                  moves.push({ from: { r: homeRow, c: 4 }, to: { r: homeRow, c: 6 }, castle: 'K' });
                }
              }

              // Nhập thành xa (Queen-side)
              const canQueenSide = color === 'w' ? castlingRights.wQ : castlingRights.bQ;
              if (canQueenSide && !b[homeRow][3] && !b[homeRow][2] && !b[homeRow][1]) {
                const rook = b[homeRow][0];
                if (rook && rook.type === 'r' && rook.color === color &&
                    !isSquareAttacked(b, homeRow, 3, enemy) &&
                    !isSquareAttacked(b, homeRow, 2, enemy)) {
                  moves.push({ from: { r: homeRow, c: 4 }, to: { r: homeRow, c: 2 }, castle: 'Q' });
                }
              }
            }
          }
        }
      }
      return moves;
    }

    // Áp dụng nước đi lên một bản sao trạng thái (dùng cho kiểm tra hợp lệ & AI)
    function applyMoveToState(state, move) {
      const nb = cloneBoard(state.board);
      const nc = { ...state.castling };
      let nep = null;

      const piece = nb[move.from.r][move.from.c];
      const capturedPiece = move.enPassant
        ? nb[move.from.r][move.to.c]
        : nb[move.to.r][move.to.c];

      nb[move.from.r][move.from.c] = null;

      if (move.enPassant) {
        nb[move.from.r][move.to.c] = null;
      }

      if (move.castle) {
        const row = move.from.r;
        if (move.castle === 'K') {
          nb[row][5] = nb[row][7];
          nb[row][7] = null;
        } else {
          nb[row][3] = nb[row][0];
          nb[row][0] = null;
        }
      }

      if (move.promotion) {
        nb[move.to.r][move.to.c] = { type: move.promotion, color: piece.color };
      } else {
        nb[move.to.r][move.to.c] = piece;
      }

      // Cập nhật quyền nhập thành
      if (piece.type === 'k') {
        if (piece.color === 'w') { nc.wK = false; nc.wQ = false; }
        else { nc.bK = false; nc.bQ = false; }
      }
      if (piece.type === 'r') {
        if (move.from.r === 7 && move.from.c === 0) nc.wQ = false;
        if (move.from.r === 7 && move.from.c === 7) nc.wK = false;
        if (move.from.r === 0 && move.from.c === 0) nc.bQ = false;
        if (move.from.r === 0 && move.from.c === 7) nc.bK = false;
      }
      if (capturedPiece && capturedPiece.type === 'r') {
        if (move.to.r === 7 && move.to.c === 0) nc.wQ = false;
        if (move.to.r === 7 && move.to.c === 7) nc.wK = false;
        if (move.to.r === 0 && move.to.c === 0) nc.bQ = false;
        if (move.to.r === 0 && move.to.c === 7) nc.bK = false;
      }

      // Cập nhật En Passant
      if (move.doublePawn) {
        nep = { r: (move.from.r + move.to.r) / 2, c: move.from.c };
      }

      return {
        board: nb,
        turn: state.turn === 'w' ? 'b' : 'w',
        castling: nc,
        enPassant: nep,
        captured: capturedPiece
      };
    }

    // Lọc ra các nước đi hợp lệ tuyệt đối (không để Vua mình bị chiếu)
    function generateLegalMoves(b, color, castlingRights, ep) {
      const pseudo = generatePseudoMoves(b, color, castlingRights, ep);
      const legal = [];
      for (const m of pseudo) {
        const next = applyMoveToState({ board: b, turn: color, castling: castlingRights, enPassant: ep }, m);
        if (!isKingInCheck(next.board, color)) {
          legal.push(m);
        }
      }
      return legal;
    }

    // Kiểm tra hòa do thiếu lực lượng (Insufficient Material)
    function isInsufficientMaterial(b) {
      const pieces = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (b[r][c]) pieces.push({ ...b[r][c], r, c });
        }
      }
      if (pieces.length === 2) return true; // Chỉ còn 2 Vua
      if (pieces.length === 3) {
        const minor = pieces.find(p => p.type === 'b' || p.type === 'n');
        if (minor) return true; // Vua + Mã/Tượng vs Vua
      }
      if (pieces.length === 4) {
        const bishops = pieces.filter(p => p.type === 'b');
        if (bishops.length === 2 && bishops[0].color !== bishops[1].color) {
          const sameColorSq = ((bishops[0].r + bishops[0].c) % 2) === ((bishops[1].r + bishops[1].c) % 2);
          if (sameColorSq) return true; // 2 tượng khác phe cùng màu ô
        }
      }
      return false;
    }

    /**
     * =========================================================================
     * 4. TRÍ TUỆ NHÂN TẠO (AI) 3 MỨC ĐỘ: DỄ, TRUNG BÌNH, KHÓ
     * =========================================================================
     */
    const PIECE_VALUES = { p: 100, n: 320, b: 335, r: 500, q: 920, k: 20000 };

    // Bảng điểm vị trí quân (Piece-Square Tables - góc nhìn quân Trắng, tự động đảo cho Đen)
    const PST = {
      p: [
        [ 0,  0,  0,  0,  0,  0,  0,  0],
        [50, 50, 50, 50, 50, 50, 50, 50],
        [10, 10, 20, 32, 32, 20, 10, 10],
        [ 5,  5, 10, 27, 27, 10,  5,  5],
        [ 0,  0,  0, 24, 24,  0,  0,  0],
        [ 5, -5,-10,  0,  0,-10, -5,  5],
        [ 5, 10, 10,-22,-22, 10, 10,  5],
        [ 0,  0,  0,  0,  0,  0,  0,  0]
      ],
      n: [
        [-50,-40,-30,-30,-30,-30,-40,-50],
        [-40,-20,  0,  0,  0,  0,-20,-40],
        [-30,  0, 12, 16, 16, 12,  0,-30],
        [-30,  5, 16, 22, 22, 16,  5,-30],
        [-30,  0, 16, 22, 22, 16,  0,-30],
        [-30,  5, 12, 16, 16, 12,  5,-30],
        [-40,-20,  0,  5,  5,  0,-20,-40],
        [-50,-40,-30,-30,-30,-30,-40,-50]
      ],
      b: [
        [-20,-10,-10,-10,-10,-10,-10,-20],
        [-10,  0,  0,  0,  0,  0,  0,-10],
        [-10,  0,  8, 12, 12,  8,  0,-10],
        [-10,  6,  6, 12, 12,  6,  6,-10],
        [-10,  0, 12, 12, 12, 12,  0,-10],
        [-10, 10, 10, 10, 10, 10, 10,-10],
        [-10,  6,  0,  0,  0,  0,  6,-10],
        [-20,-10,-10,-10,-10,-10,-10,-20]
      ],
      r: [
        [  0,  0,  0,  0,  0,  0,  0,  0],
        [  6, 12, 12, 12, 12, 12, 12,  6],
        [ -5,  0,  0,  0,  0,  0,  0, -5],
        [ -5,  0,  0,  0,  0,  0,  0, -5],
        [ -5,  0,  0,  0,  0,  0,  0, -5],
        [ -5,  0,  0,  0,  0,  0,  0, -5],
        [ -5,  0,  0,  0,  0,  0,  0, -5],
        [  0,  0,  0,  6,  6,  0,  0,  0]
      ],
      q: [
        [-20,-10,-10, -5, -5,-10,-10,-20],
        [-10,  0,  0,  0,  0,  0,  0,-10],
        [-10,  0,  6,  6,  6,  6,  0,-10],
        [ -5,  0,  6,  6,  6,  6,  0, -5],
        [  0,  0,  6,  6,  6,  6,  0, -5],
        [-10,  6,  6,  6,  6,  6,  0,-10],
        [-10,  0,  6,  0,  0,  0,  0,-10],
        [-20,-10,-10, -5, -5,-10,-10,-20]
      ],
      k: [
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-20,-30,-30,-40,-40,-30,-30,-20],
        [-10,-20,-20,-20,-20,-20,-20,-10],
        [ 20, 20,  0,  0,  0,  0, 20, 20],
        [ 20, 32, 12,  0,  0, 12, 32, 20]
      ]
    };

    function evaluateBoard(b) {
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p) continue;
          const val = PIECE_VALUES[p.type];
          const pstRow = p.color === 'w' ? r : 7 - r;
          const posBonus = PST[p.type][pstRow][c];
          if (p.color === 'w') {
            score += val + posBonus;
          } else {
            score -= val + posBonus;
          }
        }
      }
      return score;
    }

    // Sắp xếp nước đi (MVV-LVA) để cắt tỉa Alpha-Beta siêu nhanh
    function orderMoves(b, moves) {
      return moves.sort((a, bMove) => {
        let scoreA = 0;
        let scoreB = 0;
        if (a.promotion) scoreA += PIECE_VALUES[a.promotion];
        if (bMove.promotion) scoreB += PIECE_VALUES[bMove.promotion];
        if (a.capture) {
          const victim = b[a.to.r][a.to.c];
          const attacker = b[a.from.r][a.from.c];
          scoreA += 10 * (victim ? PIECE_VALUES[victim.type] : 100) - PIECE_VALUES[attacker.type];
        }
        if (bMove.capture) {
          const victim = b[bMove.to.r][bMove.to.c];
          const attacker = b[bMove.from.r][bMove.from.c];
          scoreB += 10 * (victim ? PIECE_VALUES[victim.type] : 100) - PIECE_VALUES[attacker.type];
        }
        if (a.castle) scoreA += 45;
        if (bMove.castle) scoreB += 45;
        return scoreB - scoreA;
      });
    }

    function minimax(state, depth, alpha, beta, maximizingWhite) {
      const legalMoves = generateLegalMoves(state.board, state.turn, state.castling, state.enPassant);

      if (legalMoves.length === 0) {
        if (isKingInCheck(state.board, state.turn)) {
          // Ưu tiên chiếu hết càng sớm càng tốt
          return maximizingWhite ? (-99999 - depth * 100) : (99999 + depth * 100);
        }
        return 0; // Hòa Stalemate
      }

      if (depth === 0) {
        return evaluateBoard(state.board);
      }

      const ordered = orderMoves(state.board, legalMoves);

      if (maximizingWhite) {
        let maxEval = -Infinity;
        for (const m of ordered) {
          const nextState = applyMoveToState(state, m);
          const ev = minimax(nextState, depth - 1, alpha, beta, false);
          if (ev > maxEval) maxEval = ev;
          if (ev > alpha) alpha = ev;
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of ordered) {
          const nextState = applyMoveToState(state, m);
          const ev = minimax(nextState, depth - 1, alpha, beta, true);
          if (ev < minEval) minEval = ev;
          if (ev < beta) beta = ev;
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function chooseBestAiMove() {
      const aiColor = playerColor === 'w' ? 'b' : 'w';
      const rootState = { board, turn: aiColor, castling, enPassant: enPassantTarget };
      const legalMoves = generateLegalMoves(board, aiColor, castling, enPassantTarget);
      if (legalMoves.length === 0) return null;

      // Mức độ 1: Dễ (45% đi ngẫu nhiên tự nhiên, 55% tìm kiếm nông độ sâu 1)
      if (difficulty === 1) {
        if (Math.random() < 0.45) {
          return legalMoves[Math.floor(Math.random() * legalMoves.length)];
        }
      }

      const searchDepth = difficulty === 1 ? 1 : (difficulty === 2 ? 2 : 3);
      const maximizingWhite = aiColor === 'w';
      const ordered = orderMoves(board, legalMoves);

      let bestMoves = [];
      let bestScore = maximizingWhite ? -Infinity : Infinity;

      for (const m of ordered) {
        const nextState = applyMoveToState(rootState, m);
        // Tránh lặp lại thế cờ nếu AI đang chiếm ưu thế
        const nextKey = getPositionKey(nextState.board, nextState.turn, nextState.castling, nextState.enPassant);
        const repeatPenalty = (positionHistory[nextKey] || 0) >= 1 ? (maximizingWhite ? -35 : 35) : 0;

        const score = minimax(nextState, searchDepth - 1, -Infinity, Infinity, !maximizingWhite) + repeatPenalty;

        if (maximizingWhite) {
          if (score > bestScore + 3) {
            bestScore = score;
            bestMoves = [m];
          } else if (Math.abs(score - bestScore) <= 3) {
            bestMoves.push(m);
          }
        } else {
          if (score < bestScore - 3) {
            bestScore = score;
            bestMoves = [m];
          } else if (Math.abs(score - bestScore) <= 3) {
            bestMoves.push(m);
          }
        }
      }

      return bestMoves[Math.floor(Math.random() * bestMoves.length)] || ordered[0];
    }

    /**
     * =========================================================================
     * 5. ĐIỀU KHIỂN VÁN ĐẤU & RENDER GIAO DIỆN
     * =========================================================================
     */
    function startNewGame() {
      if (aiTimer) clearTimeout(aiTimer);
      isAiThinking = false;
      board = createInitialBoard();
      turn = 'w';
      castling = { wK: true, wQ: true, bK: true, bQ: true };
      enPassantTarget = null;
      halfMoveClock = 0;
      positionHistory = {};
      moveStack = [];
      algebraicHistory = [];
      selectedSq = null;
      legalMovesForSelected = [];
      lastMove = null;
      gameResult = null;
      pendingPromotion = null;
      triggerCheckShake = false;
      cancelActiveDrag();

      const initKey = getPositionKey(board, turn, castling, enPassantTarget);
      positionHistory[initKey] = 1;

      document.getElementById('promotion-modal').classList.add('hidden');
      document.getElementById('game-over-toast').classList.add('hidden');
      document.getElementById('ai-thinking').classList.add('hidden');

      renderStylePreviews();
      updatePlayerPanels();
      renderMoveHistoryBar();
      renderBoard();

      // Nếu người chơi chọn cầm quân Đen, máy cầm Trắng đi trước
      if (playerColor === 'b') {
        scheduleAiTurn();
      }
    }

    function toggleSound() {

      document.getElementById('sound-icon-on').classList.toggle('hidden', !on);
      document.getElementById('sound-icon-off').classList.toggle('hidden', on);
      document.getElementById('sound-label').textContent = on ? 'Âm thanh' : 'Tắt tiếng';
    }

    function undoMove() {
      if (isAiThinking || pendingPromotion || moveStack.length === 0) return;
      cancelActiveDrag();

      // Nếu đang đến lượt người chơi, lùi 2 nước (nước của AI + nước của người chơi)
      // Nếu ván đã kết thúc sau nước người chơi, lùi 1 nước
      let steps = 1;
      if (turn === playerColor && moveStack.length >= 2) {
        steps = 2;
      } else if (turn !== playerColor && moveStack.length === 1 && playerColor === 'b') {
        return; // Không thể undo nước mở màn của AI nếu chưa đánh
      }

      for (let i = 0; i < steps && moveStack.length > 0; i++) {
        const snap = moveStack.pop();
        board = snap.board;
        turn = snap.turn;
        castling = snap.castling;
        enPassantTarget = snap.enPassant;
        halfMoveClock = snap.halfMoveClock;
        positionHistory = snap.positionHistory;
        lastMove = snap.lastMove;
        algebraicHistory.pop();
      }

      selectedSq = null;
      legalMovesForSelected = [];
      gameResult = null;
      triggerCheckShake = false;
      document.getElementById('game-over-toast').classList.add('hidden');

      updatePlayerPanels();
      renderMoveHistoryBar();
      renderBoard();
    }

    // Tạo ký hiệu nước đi chuẩn đại số (VD: e4, Nf3, Qxd5+, O-O, e8=Q#)
    function formatAlgebraicNotation(bBefore, move, legalMovesBefore, isCheckAfter, isMateAfter) {
      if (move.castle === 'K') return 'O-O' + (isMateAfter ? '#' : isCheckAfter ? '+' : '');
      if (move.castle === 'Q') return 'O-O-O' + (isMateAfter ? '#' : isCheckAfter ? '+' : '');

      const piece = bBefore[move.from.r][move.from.c];
      const pieceLetters = { p: '', n: 'N', b: 'B', r: 'R', q: 'Q', k: 'K' };
      let san = pieceLetters[piece.type];

      if (piece.type !== 'p') {
        const sameTypePeers = legalMovesBefore.filter(m =>
          m.to.r === move.to.r &&
          m.to.c === move.to.c &&
          (m.from.r !== move.from.r || m.from.c !== move.from.c) &&
          bBefore[m.from.r][m.from.c]?.type === piece.type
        );
        if (sameTypePeers.length > 0) {
          const sameFile = sameTypePeers.some(m => m.from.c === move.from.c);
          const sameRank = sameTypePeers.some(m => m.from.r === move.from.r);
          if (!sameFile) san += FILES[move.from.c];
          else if (!sameRank) san += String(8 - move.from.r);
          else san += FILES[move.from.c] + String(8 - move.from.r);
        }
      } else if (move.capture) {
        san += FILES[move.from.c];
      }

      if (move.capture) san += 'x';
      san += FILES[move.to.c] + String(8 - move.to.r);
      if (move.promotion) san += '=' + move.promotion.toUpperCase();
      if (isMateAfter) san += '#';
      else if (isCheckAfter) san += '+';
      return san;
    }

    function renderMoveHistoryBar() {
      const bar = document.getElementById('move-history-bar');
      if (!bar) return;
      if (algebraicHistory.length === 0) {
        bar.innerHTML = '<span class="text-stone-500 italic">Chưa có nước đi</span>';
        return;
      }
      let html = '';
      for (let i = 0; i < algebraicHistory.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const whiteMove = algebraicHistory[i];
        const blackMove = algebraicHistory[i + 1] || '';
        html += `<span class="inline-flex items-center gap-1 bg-[#262320] px-1.5 py-0.5 rounded">
          <span class="text-stone-500">${moveNum}.</span>
          <span class="text-stone-100 font-semibold">${whiteMove}</span>
          ${blackMove ? `<span class="text-amber-200/90">${blackMove}</span>` : ''}
        </span>`;
      }
      bar.innerHTML = html;
      bar.scrollLeft = bar.scrollWidth;
    }

    function executeMove(move) {
      cancelActiveDrag();
      const legalBefore = generateLegalMoves(board, turn, castling, enPassantTarget);
      const boardBefore = cloneBoard(board);

      // Lưu snapshot trước khi đi để phục vụ Undo
      moveStack.push({
        board: cloneBoard(board),
        turn,
        castling: { ...castling },
        enPassant: enPassantTarget ? { ...enPassantTarget } : null,
        halfMoveClock,
        positionHistory: { ...positionHistory },
        lastMove: lastMove ? { from: { ...lastMove.from }, to: { ...lastMove.to } } : null
      });

      const movingPiece = board[move.from.r][move.from.c];
      const next = applyMoveToState({ board, turn, castling, enPassant: enPassantTarget }, move);

      if (movingPiece.type === 'p' || move.capture) {
        halfMoveClock = 0;
      } else {
        halfMoveClock++;
      }

      board = next.board;
      turn = next.turn;
      castling = next.castling;
      enPassantTarget = next.enPassant;
      lastMove = { from: move.from, to: move.to };
      selectedSq = null;
      legalMovesForSelected = [];

      const key = getPositionKey(board, turn, castling, enPassantTarget);
      positionHistory[key] = (positionHistory[key] || 0) + 1;

      // Kiểm tra trạng thái ván đấu sau nước đi
      const nextLegalMoves = generateLegalMoves(board, turn, castling, enPassantTarget);
      const inCheckNow = isKingInCheck(board, turn);
      const isMateNow = nextLegalMoves.length === 0 && inCheckNow;

      // Kích hoạt hiệu ứng Vua giật nhẹ khi bị chiếu thường (chưa chiếu hết)
      triggerCheckShake = inCheckNow && !isMateNow;

      const san = formatAlgebraicNotation(boardBefore, move, legalBefore, inCheckNow, isMateNow);
      algebraicHistory.push(san);

      if (nextLegalMoves.length === 0) {
        if (inCheckNow) {
          const winner = turn === 'w' ? 'b' : 'w';
          gameResult = {
            status: 'checkmate',
            winner,
            reason: winner === 'w' ? 'Chiếu hết! Quân Trắng thắng' : 'Chiếu hết! Quân Đen thắng'
          };
          SoundFX.playMove(!!move.capture, true, !!move.castle);
          setTimeout(() => SoundFX.playGameOver(winner === playerColor), 220);
        } else {
          gameResult = {
            status: 'stalemate',
            winner: null,
            reason: 'Hòa cờ (Hết nước đi - Stalemate)'
          };
          SoundFX.playMove(!!move.capture, false, !!move.castle);
        }
      } else if (isInsufficientMaterial(board)) {
        gameResult = { status: 'draw', winner: null, reason: 'Hòa cờ (Không đủ lực lượng chiếu hết)' };
        SoundFX.playMove(!!move.capture, inCheckNow, !!move.castle);
      } else if (positionHistory[key] >= 3) {
        gameResult = { status: 'draw', winner: null, reason: 'Hòa cờ (Lặp lại thế cờ 3 lần)' };
        SoundFX.playMove(!!move.capture, inCheckNow, !!move.castle);
      } else if (halfMoveClock >= 100) {
        gameResult = { status: 'draw', winner: null, reason: 'Hòa cờ (Luật 50 nước)' };
        SoundFX.playMove(!!move.capture, inCheckNow, !!move.castle);
      } else {
        SoundFX.playMove(!!move.capture, inCheckNow, !!move.castle);
      }

      updatePlayerPanels();
      renderMoveHistoryBar();
      renderBoard();

      if (gameResult) {
        const toast = document.getElementById('game-over-toast');
        document.getElementById('game-over-text').textContent = gameResult.reason;
        toast.classList.remove('hidden');
      } else if (turn !== playerColor) {
        scheduleAiTurn();
      }
    }

    function scheduleAiTurn() {
      isAiThinking = true;
      document.getElementById('ai-thinking').classList.remove('hidden');
      document.getElementById('btn-undo').disabled = true;

      aiTimer = setTimeout(() => {
        const aiMove = chooseBestAiMove();
        isAiThinking = false;
        document.getElementById('ai-thinking').classList.add('hidden');
        document.getElementById('btn-undo').disabled = false;
        if (aiMove) {
          executeMove(aiMove);
        }
      }, 280);
    }

    /**
     * =========================================================================
     * HỆ THỐNG KÉO THẢ MƯỢT MÀ 60FPS (POINTER EVENTS) + CLICK-TO-MOVE
     * =========================================================================
     */
    function getSquareFromClientCoords(clientX, clientY) {
      const boardEl = document.getElementById('chess-board');
      const rect = boardEl.getBoundingClientRect();
      if (
        clientX < rect.left ||
        clientX > rect.right ||
        clientY < rect.top ||
        clientY > rect.bottom
      ) {
        return null;
      }
      const viewC = Math.floor(((clientX - rect.left) / rect.width) * 8);
      const viewR = Math.floor(((clientY - rect.top) / rect.height) * 8);
      if (viewR < 0 || viewR > 7 || viewC < 0 || viewC > 7) return null;

      const r = flipped ? 7 - viewR : viewR;
      const c = flipped ? 7 - viewC : viewC;
      return { r, c };
    }

    function updateGhostPosition(clientX, clientY) {
      const ghost = document.getElementById('drag-ghost');
      ghost.style.left = `${clientX}px`;
      ghost.style.top = `${clientY}px`;
    }

    function cancelActiveDrag() {
      const ghost = document.getElementById('drag-ghost');
      if (ghost) {
        ghost.style.display = 'none';
        ghost.innerHTML = '';
      }
      document.querySelectorAll('.dragging-source').forEach(el => el.classList.remove('dragging-source'));
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragState = {
        active: false,
        pointerId: null,
        from: null,
        startX: 0,
        startY: 0,
        hasMoved: false,
        hoverSq: null
      };
    }

    function handleBoardPointerDown(e) {
      if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
      if (gameResult || isAiThinking || pendingPromotion || turn !== playerColor) return;

      const sqPos = getSquareFromClientCoords(e.clientX, e.clientY);
      if (!sqPos) return;

      const { r, c } = sqPos;
      const clickedPiece = board[r][c];

      // Trường hợp 1: Bấm vào quân của phe mình -> Chọn quân & chuẩn bị kéo thả
      if (clickedPiece && clickedPiece.color === playerColor) {
        const isSameSquare = selectedSq && selectedSq.r === r && selectedSq.c === c;
        selectedSq = { r, c };
        const allLegal = generateLegalMoves(board, playerColor, castling, enPassantTarget);
        legalMovesForSelected = allLegal.filter(m => m.from.r === r && m.from.c === c);

        renderBoard();

        // Khởi tạo trạng thái kéo (chưa hiện ghost cho tới khi di chuyển quá 3px để phân biệt click thuần túy)
        dragState = {
          active: true,
          pointerId: e.pointerId,
          from: { r, c },
          startX: e.clientX,
          startY: e.clientY,
          hasMoved: false,
          hoverSq: { r, c },
          toggleDeselectOnClick: isSameSquare
        };

        try {
          e.currentTarget.setPointerCapture(e.pointerId);
        } catch (err) {}
        return;
      }

      // Trường hợp 2: Đã chọn quân từ trước và bấm vào ô đích (trống hoặc quân địch)
      if (selectedSq) {
        const matchingMoves = legalMovesForSelected.filter(m => m.to.r === r && m.to.c === c);
        if (matchingMoves.length > 0) {
          if (matchingMoves[0].promotion) {
            openPromotionModal(matchingMoves[0].from, matchingMoves[0].to);
            return;
          }
          executeMove(matchingMoves[0]);
          return;
        }
      }

      // Bấm ra ô trống không hợp lệ -> bỏ chọn
      selectedSq = null;
      legalMovesForSelected = [];
      renderBoard();
    }

    function handleBoardPointerMove(e) {
      if (!dragState.active || e.pointerId !== dragState.pointerId) return;

      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;

      // Kích hoạt chế độ kéo nổi khi con trỏ di chuyển vượt ngưỡng 4px
      if (!dragState.hasMoved) {
        if (Math.hypot(dx, dy) < 4) return;
        dragState.hasMoved = true;

        const piece = board[dragState.from.r][dragState.from.c];
        if (!piece) {
          cancelActiveDrag();
          return;
        }

        const boardEl = document.getElementById('chess-board');
        const sqSize = boardEl.getBoundingClientRect().width / 8;

        const ghost = document.getElementById('drag-ghost');
        ghost.style.width = `${sqSize * 0.88}px`;
        ghost.style.height = `${sqSize * 0.88}px`;
        ghost.innerHTML = getPieceSVG(piece.type, piece.color);
        ghost.style.display = 'flex';

        const srcEl = document.querySelector(`[data-r="${dragState.from.r}"][data-c="${dragState.from.c}"] .piece-container`);
        if (srcEl) srcEl.classList.add('dragging-source');
      }

      updateGhostPosition(e.clientX, e.clientY);

      // Cập nhật viền sáng ô đang rê quân qua
      const hoverPos = getSquareFromClientCoords(e.clientX, e.clientY);
      const prevHover = dragState.hoverSq;
      if (!prevHover || !hoverPos || prevHover.r !== hoverPos.r || prevHover.c !== hoverPos.c) {
        if (prevHover) {
          const prevEl = document.querySelector(`[data-r="${prevHover.r}"][data-c="${prevHover.c}"]`);
          if (prevEl) prevEl.classList.remove('drag-over');
        }
        if (hoverPos) {
          const nextEl = document.querySelector(`[data-r="${hoverPos.r}"][data-c="${hoverPos.c}"]`);
          if (nextEl) nextEl.classList.add('drag-over');
        }
        dragState.hoverSq = hoverPos;
      }
    }

    function handleBoardPointerUp(e) {
      if (!dragState.active || e.pointerId !== dragState.pointerId) return;

      const wasDragged = dragState.hasMoved;
      const fromSq = dragState.from;
      const toggleDeselect = dragState.toggleDeselectOnClick;

      try {
        e.currentTarget.releasePointerCapture(e.pointerId);
      } catch (err) {}

      cancelActiveDrag();

      // Nếu người chơi chỉ bấm tại chỗ (không kéo) và bấm lại đúng quân đang chọn -> bỏ chọn
      if (!wasDragged) {
        if (toggleDeselect) {
          selectedSq = null;
          legalMovesForSelected = [];
          renderBoard();
        }
        return;
      }

      // Nếu có kéo quân: kiểm tra ô đích thả chuột/ngón tay
      const dropPos = getSquareFromClientCoords(e.clientX, e.clientY);
      if (dropPos && (dropPos.r !== fromSq.r || dropPos.c !== fromSq.c)) {
        const matchingMoves = legalMovesForSelected.filter(m => m.to.r === dropPos.r && m.to.c === dropPos.c);
        if (matchingMoves.length > 0) {
          if (matchingMoves[0].promotion) {
            openPromotionModal(matchingMoves[0].from, matchingMoves[0].to);
            return;
          }
          executeMove(matchingMoves[0]);
          return;
        }
      }

      // Thả ra ngoài hoặc ô không hợp lệ -> Giữ nguyên trạng thái đang chọn quân đó để có thể bấm tiếp
      renderBoard();
    }

    function openPromotionModal(from, to) {
      pendingPromotion = { from, to };
      const container = document.getElementById('promotion-options');
      container.innerHTML = '';
      ['q', 'r', 'b', 'n'].forEach(type => {
        const btn = document.createElement('button');
        btn.className = 'promo-choice aspect-square rounded-xl p-1.5 flex items-center justify-center cursor-pointer shadow-md';
        btn.innerHTML = getPieceSVG(type, playerColor);
        btn.onclick = () => {
          document.getElementById('promotion-modal').classList.add('hidden');
          const move = { from, to, promotion: type, capture: !!board[to.r][to.c] };
          pendingPromotion = null;
          executeMove(move);
        };
        container.appendChild(btn);
      });
      document.getElementById('promotion-modal').classList.remove('hidden');
    }

    // Tính danh sách quân bị ăn để hiển thị gọn đẹp trên thanh người chơi
    function updateCapturedPieces() {
      const startCounts = { q: 1, r: 2, b: 2, n: 2, p: 8 };
      const current = { w: { q: 0, r: 0, b: 0, n: 0, p: 0 }, b: { q: 0, r: 0, b: 0, n: 0, p: 0 } };

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p && p.type !== 'k') current[p.color][p.type]++;
        }
      }

      // Quân đen bị mất (do Trắng ăn) & Quân trắng bị mất (do Đen ăn)
      const lostByBlack = [];
      const lostByWhite = [];
      for (const t of ['q', 'r', 'b', 'n', 'p']) {
        for (let i = 0; i < Math.max(0, startCounts[t] - current.b[t]); i++) lostByBlack.push(t);
        for (let i = 0; i < Math.max(0, startCounts[t] - current.w[t]); i++) lostByWhite.push(t);
      }

      const topColor = flipped ? 'w' : 'b';
      const bottomColor = flipped ? 'b' : 'w';

      const topCapturedEl = document.getElementById('top-captured');
      const bottomCapturedEl = document.getElementById('bottom-captured');

      // Quân mà người ngồi phía trên đã ăn được (tức là quân của phe dưới bị mất)
      const topWonPieces = topColor === 'w' ? lostByBlack : lostByWhite;
      const topWonPieceColor = topColor === 'w' ? 'b' : 'w';

      const bottomWonPieces = bottomColor === 'w' ? lostByBlack : lostByWhite;
      const bottomWonPieceColor = bottomColor === 'w' ? 'b' : 'w';

      topCapturedEl.innerHTML = topWonPieces
        .map(t => `<div class="w-4 h-4 -ml-1 first:ml-0">${getPieceSVG(t, topWonPieceColor)}</div>`)
        .join('');

      bottomCapturedEl.innerHTML = bottomWonPieces
        .map(t => `<div class="w-4 h-4 -ml-1 first:ml-0">${getPieceSVG(t, bottomWonPieceColor)}</div>`)
        .join('');
    }

    function updatePlayerPanels() {
      const levelNames = { 1: 'Dễ', 2: 'Trung bình', 3: 'Khó' };
      const topColor = flipped ? 'w' : 'b';
      const bottomColor = flipped ? 'b' : 'w';

      const isTopAi = topColor !== playerColor;
      document.getElementById('top-name').textContent = isTopAi
        ? `Máy (${levelNames[difficulty]})`
        : `Người chơi (${topColor === 'w' ? 'Trắng' : 'Đen'})`;
      document.getElementById('top-avatar').textContent = isTopAi ? 'AI' : 'BẠN';
      document.getElementById('top-avatar').className = topColor === 'w'
        ? 'w-8 h-8 rounded-lg bg-[#e8e6e3] border border-[#b5b0a8] flex items-center justify-center font-bold text-xs text-[#262421]'
        : 'w-8 h-8 rounded-lg bg-[#3c3936] border border-[#524e4a] flex items-center justify-center font-bold text-xs text-stone-200';

      const isBottomAi = bottomColor !== playerColor;
      document.getElementById('bottom-name').textContent = isBottomAi
        ? `Máy (${levelNames[difficulty]})`
        : `Người chơi (${bottomColor === 'w' ? 'Trắng' : 'Đen'})`;
      document.getElementById('bottom-avatar').textContent = isBottomAi ? 'AI' : 'BẠN';
      document.getElementById('bottom-avatar').className = bottomColor === 'w'
        ? 'w-8 h-8 rounded-lg bg-[#e8e6e3] border border-[#b5b0a8] flex items-center justify-center font-bold text-xs text-[#262421]'
        : 'w-8 h-8 rounded-lg bg-[#3c3936] border border-[#524e4a] flex items-center justify-center font-bold text-xs text-stone-200';

      const statusEl = document.getElementById('status-banner');
      if (gameResult) {
        statusEl.textContent = gameResult.status === 'checkmate' ? 'Chiếu hết!' : 'Hòa cờ';
        statusEl.className = 'text-xs sm:text-sm font-bold px-3 py-1 rounded-lg bg-rose-600/90 text-white border border-rose-400';
      } else {
        const checked = isKingInCheck(board, turn);
        const turnText = turn === 'w' ? 'Lượt quân Trắng' : 'Lượt quân Đen';
        statusEl.textContent = checked ? `${turnText} (Chiếu!)` : turnText;
        statusEl.className = checked
          ? 'text-xs sm:text-sm font-bold px-3 py-1 rounded-lg bg-rose-600/85 text-white border border-rose-400'
          : 'text-xs sm:text-sm font-semibold px-3 py-1 rounded-lg bg-[#312e2b] text-amber-200 border border-[#45413c]';
      }

      document.getElementById('btn-undo').disabled = moveStack.length === 0 || isAiThinking;
      updateCapturedPieces();
    }

    /**
     * =========================================================================
     * 6. RENDER BÀN CỜ & HIỆU ỨNG VUA NẰM NGANG + HUY HIỆU KHI CHIẾU HẾT
     * =========================================================================
     */
    function renderBoard() {
      const boardEl = document.getElementById('chess-board');
      boardEl.innerHTML = '';

      const checkedKingColor = isKingInCheck(board, turn) ? turn : null;

      for (let viewR = 0; viewR < 8; viewR++) {
        for (let viewC = 0; viewC < 8; viewC++) {
          const r = flipped ? 7 - viewR : viewR;
          const c = flipped ? 7 - viewC : viewC;

          const isLight = (r + c) % 2 === 0;
          const sq = document.createElement('div');
          sq.className = `square ${isLight ? 'light' : 'dark'}`;
          sq.dataset.r = String(r);
          sq.dataset.c = String(c);

          // Highlight nước đi vừa thực hiện
          if (lastMove && ((lastMove.from.r === r && lastMove.from.c === c) || (lastMove.to.r === r && lastMove.to.c === c))) {
            sq.classList.add('last-move');
          }

          // Highlight ô đang chọn
          if (selectedSq && selectedSq.r === r && selectedSq.c === c) {
            sq.classList.add('selected');
          }

          const piece = board[r][c];

          // Highlight ô Vua bị chiếu hoặc chiếu hết (đỏ san hô cảnh báo)
          if (piece && piece.type === 'k' && piece.color === checkedKingColor) {
            sq.classList.add('in-check');
          }

          // Lớp phủ màu nền trạng thái
          const overlay = document.createElement('div');
          overlay.className = 'square-overlay';
          sq.appendChild(overlay);

          // Tọa độ bàn cờ
          if (viewC === 0) {
            const rankLabel = document.createElement('span');
            rankLabel.className = 'coord-rank';
            rankLabel.textContent = String(8 - r);
            sq.appendChild(rankLabel);
          }

          if (viewR === 7) {
            const fileLabel = document.createElement('span');
            fileLabel.className = 'coord-file';
            fileLabel.textContent = FILES[c];
            sq.appendChild(fileLabel);
          }

          // Hiển thị quân cờ
          if (piece) {
            const pieceWrap = document.createElement('div');
            pieceWrap.className = 'piece-container';

            // Khi chiếu hết: Vua thua cuộc xoay ngang 90 độ nằm đổ xuống!
            const isCheckmatedKing =
              gameResult &&
              gameResult.status === 'checkmate' &&
              piece.type === 'k' &&
              piece.color !== gameResult.winner;

            const isWinnerKing =
              gameResult &&
              gameResult.status === 'checkmate' &&
              piece.type === 'k' &&
              piece.color === gameResult.winner;

            // Khi bị chiếu thường: Vua giật nhẹ cảnh báo
            const isCheckedKing =
              !gameResult &&
              piece.type === 'k' &&
              piece.color === checkedKingColor &&
              triggerCheckShake;

            if (isCheckmatedKing) {
              pieceWrap.classList.add('checkmated-king');
            } else if (isCheckedKing) {
              pieceWrap.classList.add('checked-king-shake');
            }

            pieceWrap.innerHTML = getPieceSVG(piece.type, piece.color);
            sq.appendChild(pieceWrap);

            // Huy hiệu tròn đỏ (Vua đổ ngang) và xanh lá (Vương miện thắng) y hệt ảnh 1
            if (isCheckmatedKing) {
              const badge = document.createElement('div');
              badge.className = 'endgame-badge badge-loser';
              badge.innerHTML = `
                <svg viewBox="0 0 24 24" class="w-3/4 h-3/4" style="transform: rotate(90deg);">
                  <path d="M12 3v4M10 5h4M7 19h10l1.2-6.5c.4-2.2-1.2-4.2-3.4-4.2-1.2 0-2.2.6-2.8 1.5-.6-.9-1.6-1.5-2.8-1.5-2.2 0-3.8 2-3.4 4.2L7 19z"
                        fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`;
              sq.appendChild(badge);
            } else if (isWinnerKing) {
              const badge = document.createElement('div');
              badge.className = 'endgame-badge badge-winner';
              badge.innerHTML = `
                <svg viewBox="0 0 24 24" class="w-3/4 h-3/4">
                  <path d="M4 17h16l1.5-8.5-5 4L12 6l-4.5 6.5-5-4L4 17z"
                        fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
                </svg>`;
              sq.appendChild(badge);
            }
          }

          // Hiển thị chấm gợi ý nước đi hợp lệ
          const hintMove = legalMovesForSelected.find(m => m.to.r === r && m.to.c === c);
          if (hintMove) {
            const hint = document.createElement('div');
            hint.className = piece ? 'move-hint-capture' : 'move-hint-dot';
            sq.appendChild(hint);
          }

          boardEl.appendChild(sq);
        }
      }

      // Chỉ kích hoạt animation giật Vua một lần ngay sau nước chiếu
      triggerCheckShake = false;
    }

    // Khởi chạy ván đấu & gắn sự kiện Kéo thả Pointer Events khi tải xong trang
    window.addEventListener('DOMContentLoaded', () => {
      const boardEl = document.getElementById('chess-board');
      boardEl.addEventListener('pointerdown', handleBoardPointerDown);
      boardEl.addEventListener('pointermove', handleBoardPointerMove);
      boardEl.addEventListener('pointerup', handleBoardPointerUp);
      boardEl.addEventListener('pointercancel', cancelActiveDrag);

      startNewGame();
    });
  </script>
